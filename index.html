<!DOCTYPE html>

    <style>
        /* Menghilangkan semua space kosong bawaan browser */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body, html {
            width: 100%;
            height: 100%;
            overflow: hidden; /* Mencegah double scrollbar */
            background-color: #ffffff;
        }

        iframe {
            /* Menggunakan viewport units untuk memaksa ukuran */
            width: 100vw; 
            height: 100vh;
            
            /* Memastikan posisi benar-benar di pojok kiri atas */
            position: fixed;
            top: 0;
            left: 0;
            
            border: none;
            display: block;
        }
    </style>
</head>
<body>

        src="https://script.google.com/macros/s/AKfycbzYXbOfBd3GP3VhP1wGN7FGsIvPZ1R5xGn3zrSlGAM52Ye5mXXS2D6la1xU9w7TgbbSag/exec"
